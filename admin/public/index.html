<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenEDU Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; display: flex; height: 100vh; background: #1e1e1e; color: #ccc; }
        .sidebar { width: 240px; background: #252526; padding: 15px; overflow-y: auto; border-right: 1px solid #333; flex-shrink: 0; }
        .sidebar h3 { margin-top: 0; color: #fff; }
        .sidebar select { width: 100%; padding: 8px; margin-bottom: 10px; background: #3c3c3c; color: #ccc; border: 1px solid #555; border-radius: 4px; }
        .file-item { padding: 8px 12px; cursor: pointer; border-radius: 4px; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; }
        .file-item:hover { background: #2a2d2e; }
        .file-item.active { background: #094771; color: #fff; }
        .file-item .time { font-size: 0.75em; color: #888; }
        
        .main { flex: 1; display: flex; flex-direction: column; padding: 15px; min-width: 0; }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
        .toolbar button, .toolbar label { padding: 8px 14px; background: #0e639c; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .toolbar button:hover { background: #1177bb; }
        .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
        .toolbar input[type="file"] { display: none; }
        
        .editor-preview-container { display: flex; flex: 1; gap: 10px; min-height: 0; }
        .editor-wrapper { flex: 3; display: flex; flex-direction: column; min-width: 0; }
        .preview-wrapper { flex: 2; display: flex; flex-direction: column; min-width: 0; border-left: 1px solid #333; padding-left: 10px; }
        .preview-wrapper h4 { margin: 0 0 8px 0; color: #fff; font-size: 14px; }
        .preview-wrapper input { width: 100%; padding: 6px; background: #3c3c3c; color: #ccc; border: 1px solid #555; border-radius: 4px; margin-bottom: 6px; }
        .preview-wrapper button { padding: 6px 12px; background: #0e639c; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .preview-wrapper button:hover { background: #1177bb; }
        .preview-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; background: #2d2d2d; border-radius: 4px; color: #888; font-size: 13px; }
        
        #editor { flex: 1; border: 1px solid #333; min-height: 350px; }
        #status { margin-top: 10px; padding: 10px; border-radius: 4px; font-size: 13px; }
        .success { background: #1e3a2f; color: #7ec8a3; }
        .error { background: #3a1e1e; color: #e06c75; }
        .info { background: #1e2a3a; color: #61afef; }
        .history { margin-top: 10px; padding: 8px; background: #252526; border-radius: 4px; font-size: 12px; }
        .history div { padding: 4px 0; border-bottom: 1px solid #333; }
        .history span { color: #888; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3><i class="bi bi-book"></i> Courses</h3>
    <select id="course-select">
        <option value="course-1">Course 1</option>
        <option value="course-2" selected>Course 2</option>
        <option value="course-3">Course 3</option>
    </select>
    <div id="file-list"></div>
    <hr style="border-color:#333;">
    <div id="history" class="history"><strong>Recent Commits</strong></div>
</div>

<div class="main">
    <div class="toolbar">
        <button id="save-btn"><i class="bi bi-cloud-upload"></i> Save & Push</button>
        <button id="purge-btn"><i class="bi bi-trash"></i> Purge CDN</button>
        <label for="upload-input"><i class="bi bi-upload"></i> Upload File</label>
        <input type="file" id="upload-input" multiple>
        <select id="subfolder-select" style="padding:6px;background:#3c3c3c;color:#ccc;border:1px solid #555;border-radius:4px;">
            <option value="">Root</option>
            <option value="audio">Audio</option>
            <option value="images">Images</option>
            <option value="lyric">Lyric</option>
        </select>
    </div>

    <!-- 左右分栏：编辑器 + 预览 -->
    <div class="editor-preview-container">
        <div class="editor-wrapper">
            <div id="editor"></div>
        </div>
        <div class="preview-wrapper">
            <h4><i class="bi bi-eye"></i> Preview</h4>
            <input type="url" id="frontend-url" placeholder="Paste frontend URL (e.g., https://xxx.pages.dev)" />
            <button id="preview-btn"><i class="bi bi-box-arrow-up-right"></i> Open in New Tab</button>
            <div class="preview-placeholder">
                Enter the deployment URL above and click "Open in New Tab".
            </div>
        </div>
    </div>

    <div id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });

let editor;
let currentFilePath = '';
const fileListEl = document.getElementById('file-list');
const statusEl = document.getElementById('status');
const historyEl = document.getElementById('history');
const courseSelect = document.getElementById('course-select');
const subfolderSelect = document.getElementById('subfolder-select');
const uploadInput = document.getElementById('upload-input');
const frontendUrlInput = document.getElementById('frontend-url');
const previewBtn = document.getElementById('preview-btn');

function showStatus(msg, type = 'info') {
    statusEl.textContent = msg;
    statusEl.className = type;
}

// 预览按钮：在新标签页打开
previewBtn.onclick = () => {
    const baseUrl = frontendUrlInput.value.trim();
    if (!baseUrl) {
        showStatus('Please enter the frontend deployment URL first.', 'error');
        return;
    }
    const course = courseSelect.value;
    const courseNum = course.replace('course-', '');
    const cleanUrl = baseUrl.replace(/\/+$/, '');
    window.open(`${cleanUrl}/course/${courseNum}`, '_blank');
};

// 加载文件列表
async function loadFiles(course) {
    try {
        const res = await fetch(`/api/files?dir=${course}`);
        const files = await res.json();
        fileListEl.innerHTML = '';
        files.forEach(f => {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `<span>${f.name}</span><span class="time">${new Date(f.mtime).toLocaleTimeString()}</span>`;
            div.onclick = () => loadFileContent(f.path, div);
            fileListEl.appendChild(div);
        });
        if (files.length > 0) {
            const first = fileListEl.firstChild;
            loadFileContent(files[0].path, first);
        }
    } catch (e) {
        showStatus('Failed to load files: ' + e.message, 'error');
    }
}

// 加载文件内容到编辑器
async function loadFileContent(path, element) {
    try {
        const res = await fetch(`/api/read?path=${encodeURIComponent(path)}`);
        const content = await res.text();
        if (editor) editor.setValue(content);
        currentFilePath = path;
        document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
        if (element) element.classList.add('active');
    } catch (e) {
        showStatus('Failed to read file', 'error');
    }
}

// 保存
document.getElementById('save-btn').onclick = async () => {
    if (!currentFilePath) return showStatus('No file selected', 'error');
    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    showStatus('Saving...');
    try {
        const res = await fetch('/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: currentFilePath, content: editor.getValue() })
        });
        const data = await res.json();
        showStatus(data.message || data.error, data.error ? 'error' : 'success');
        loadHistory();
    } catch (e) {
        showStatus('Save failed: ' + e.message, 'error');
    }
    btn.disabled = false;
};

// 清理缓存
document.getElementById('purge-btn').onclick = async () => {
    const course = courseSelect.value;
    const btn = document.getElementById('purge-btn');
    btn.disabled = true;
    showStatus(`Purging CDN cache for ${course}...`);
    try {
        const res = await fetch('/api/purge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ course })
        });
        const data = await res.json();
        showStatus(data.message, data.error ? 'error' : 'success');
    } catch (e) {
        showStatus('Purge failed: ' + e.message, 'error');
    }
    btn.disabled = false;
};

// 上传文件
uploadInput.onchange = async (e) => {
    const files = e.target.files;
    if (!files.length) return;
    const course = courseSelect.value;
    const subfolder = subfolderSelect.value;
    const formData = new FormData();
    formData.append('course', course);
    formData.append('subfolder', subfolder);
    for (let file of files) {
        formData.append('file', file);
    }
    showStatus(`Uploading ${files.length} file(s)...`);
    try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();
        showStatus(data.message, data.error ? 'error' : 'success');
        loadHistory();
    } catch (e) {
        showStatus('Upload failed', 'error');
    }
    uploadInput.value = '';
};

// 加载提交历史
async function loadHistory() {
    try {
        const res = await fetch('/api/history');
        const commits = await res.json();
        historyEl.innerHTML = '<strong>Recent Commits</strong>';
        commits.forEach(c => {
            const d = document.createElement('div');
            d.innerHTML = `<span>${new Date(c.date).toLocaleString()}</span> - ${c.message.substring(0, 50)}`;
            historyEl.appendChild(d);
        });
    } catch (e) {}
}

// 切换课程
courseSelect.onchange = () => {
    loadFiles(courseSelect.value);
};

// 初始化编辑器
require(['vs/editor/editor.main'], function() {
    editor = monaco.editor.create(document.getElementById('editor'), {
        value: '',
        language: 'json',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 14,
        minimap: { enabled: false }
    });
});

// 初始加载
loadFiles('course-2');
loadHistory();
</script>
</body>
</html>
